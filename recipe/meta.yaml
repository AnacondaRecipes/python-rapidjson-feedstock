{% set name = "python-rapidjson" %}
{% set version = "1.20" %}
{% set sha256 = "115f08c86d2df7543c02605e77c84727cdabc4b08310d2f097e953efeaaa73eb" %}
{% set rapidjson_version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/python_rapidjson-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  # This package isn't included in the SOW Packages.
  skip: True  # [py38 or s390x]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - wheel
    - setuptools
    - packaging
  run:
    - python

test:
  imports:
    - rapidjson
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/python-rapidjson/python-rapidjson
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Python wrapper around rapidjson'
  description: |
    Python wrapper around RapidJSON. RapidJSON is an extremely fast C++ json serialization library.
    We do not support legacy python versions, you will need to upgrade to Python 3 to use this library.
  doc_url: https://python-rapidjson.readthedocs.io
  dev_url: https://github.com/python-rapidjson/python-rapidjson

extra:
  recipe-maintainers:
    - SylvainCorlay
    - hajapy
